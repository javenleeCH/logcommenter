# 发布 VSCode 插件到 GitHub Packages (npm registry) + 打包 VSIX 上传到 GitHub Release。
# 触发条件与 release.yml 一致：手动触发或 push v* tag。
#
# 产物：
#   1. npm 包 → GitHub Packages
#   2. .vsix 文件 → 附加到 GitHub Release（用户可手动 Install from VSIX）
name: publish-npm
permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag（VSIX 将附加到该 release）'
        required: false
        type: string
  push:
    tags: ['v*']

jobs:
  publish:
    name: build & publish vscode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: vscode
        run: npm install --no-audit --no-fund

      - name: Build (tsc)
        working-directory: vscode
        run: npm run build

      - name: Run tests
        working-directory: vscode
        run: node --test dist/test/protocol.test.js

      # ---- 解析 release tag，并以 tag 同步插件版本号（tag 是唯一版本来源）----
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync package version from tag
        working-directory: vscode
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${TAG#v}"
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' 不是 vX.Y.Z 语义化版本，无法同步版本号"
            exit 1
          fi
          echo "package.json version -> $VER"
          npm pkg set version="$VER"

      # ---- VSIX package ----
      - name: Package VSIX
        working-directory: vscode
        run: npx @vscode/vsce package --no-dependencies -o ../logcommenter.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: logcommenter-vsix
          path: logcommenter.vsix
          if-no-files-found: error

      - name: Attach VSIX to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "No tag resolved, skipping release upload"
            exit 0
          fi
          if ! gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" -R "${{ github.repository }}" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" logcommenter.vsix -R "${{ github.repository }}" --clobber

      # ---- npm publish to GitHub Packages（放最后：失败不吞、也不阻断 VSIX 附加）----
      # GitHub Packages 只接受 @owner/ 作用域包名，unscoped PUT 一律 E404；
      # 且 npm 的 --scope 只影响 install 的 registry 解析，不会改发布名。
      # VSCE 不支持 scoped name，故仅在发布步内临时改写 name（作业随即结束，无需还原）。
      # 幂等：重跑 release 时已发布的版本跳过（npm view 预检）；
      # token 失效时 view 拦不住、npm publish 会红，凭据问题不会被跳过掩盖。
      - name: Publish to GitHub Packages
        working-directory: vscode
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER="${{ steps.tag.outputs.tag }}"
          VER="${VER#v}"
          cat > .npmrc <<'EOF'
          //npm.pkg.github.com/:_authToken=${NPM_TOKEN}
          @javenleech:registry=https://npm.pkg.github.com
          EOF
          npm pkg set name='@javenleech/logcommenter'
          if npm view "@javenleech/logcommenter@${VER}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::notice::@javenleech/logcommenter@${VER} 已存在于 GitHub Packages，跳过发布"
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
