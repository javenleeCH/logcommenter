# 发布工作流：三平台（Linux / Windows / macOS）现场编译 LLVM 23 静态链接，
# 构建 logcommenter 可执行文件，并附加到指定 release tag。
# 三平台均启用 ccache（ccache 4.x 支持 MSVC），冷编一次后后续 release 增量构建。
# 只在手动触发或 push 到 v* tag 时运行（不影响日常 CI）。
name: release

# 上传 release 资产需要 contents: write（workflow_dispatch 默认未开，否则 gh release upload 报 403）
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag 名（如 v0.1.0），构建产物将附加到该 release'
        required: true
        type: string
  push:
    tags: ['v*']

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      # 注：macOS 暂不支持（现场编译 LLVM 冷编过久），后续加回即可补一行 include。
      matrix:
        include:
          - os: ubuntu-latest
            artifact: logcommenter-linux-x86_64
            exe: build/logcommenter
            cache_path: ~/.cache/ccache
            install: sudo apt-get update && sudo apt-get install -y ccache ninja-build
          - os: windows-latest
            artifact: logcommenter-windows-x86_64
            exe: build/logcommenter.exe
            cache_path: C:\Users\runneradmin\AppData\Local\ccache
            install: choco install ccache -y && choco install ninja -y
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ matrix.cache_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_path }}
          # ccache 内容寻址，跨构建累积命中，key 固定按 LLVM 版本（与 LLVM 源码缓存一致），
          # 不要用 hashFiles(CMakeLists.txt) —— 那样 CMake 一改整份缓存就失效。
          key: ccache-release-${{ matrix.os }}-llvm-23.1.3
          # restore-keys 只在极端情况下兜底恢复，平时 key 固定即可命中主缓存
          restore-keys: |
            ccache-release-${{ matrix.os }}-

      # CPM 检测到源码已存在则跳过下载/解压。必须同时缓存 subbuild（含 ExternalProject
      # stamp）：只缓存 src 时每次 configure 仍会重下 1.4GB zip。key 固定按 LLVM 版本，升级时手动改。
      - name: Cache LLVM source (CPM)
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/llvm_project-src
            build/_deps/llvm_project-subbuild
          key: llvm-src-${{ matrix.os }}-23.1.3

      - name: Install ccache
        run: ${{ matrix.install }}

      # Ninja generator 不像 VS generator 会自动定位 MSVC，需显式加载 MSVC 开发环境
      # （vcvarsall：cl/link/include/lib 进 PATH）。否则 Windows 上 llvm-tblgen 链接产物
      # 运行报 0xC0000139（入口点找不到）。仅 Windows 需要。
      - name: Enable MSVC dev environment (for Ninja on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Configure
        # 两平台统一 Ninja + ccache（[N/M] 计数）；Windows 环境由上方 msvc-dev-cmd 补齐。
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G Ninja -DLOGCOMMENTER_BUILD_AST=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          else
            cmake -S . -B build -G Ninja -DLOGCOMMENTER_BUILD_AST=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          fi
        shell: bash

      - name: Build logcommenter
        # Windows 上 --parallel 限制并行度避免 OOM；Linux 用 nproc
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build build --target logcommenter --parallel 2
          else
            cmake --build build --target logcommenter --parallel $(nproc)
          fi
        shell: bash

      - name: Package zip (platform-prefixed)
        run: |
          # exe 与 clang 内置头同包分发：clang 的 builtin 头（stddef.h 等）只从
          # <resource-dir>/include 查找，-resource-dir 指向 lib/clang/<ver> 版本目录。
          # 优先复制构建树 clang-resource-headers 生成的完整内置头（含 tablegen 产物），
          # 无则回退源码头。
          mkdir -p package/lib/clang
          copied=""
          for d in build/_deps/llvm_project-build/lib/clang/*/include; do
            if [ -d "$d" ]; then cp -r "$(dirname "$d")" package/lib/clang/; copied=1; break; fi
          done
          if [ -z "$copied" ]; then
            mkdir -p package/lib/clang/23.1.3/include
            cp -r build/_deps/llvm_project-src/clang/lib/Headers/* package/lib/clang/23.1.3/include/
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/logcommenter.exe package/logcommenter.exe
            # 在 package 内压缩，路径展平到 zip 根；单引号防 bash 展开 * / \（由 PowerShell 处理）
            powershell -Command 'Set-Location package; Compress-Archive -Path * -DestinationPath ..\${{ matrix.artifact }}.zip -Force'
          else
            cp build/logcommenter package/logcommenter
            (cd package && zip -r ../${{ matrix.artifact }}.zip .)
          fi
          rm -rf package
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  attach:
    name: attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT";
          else echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"; fi

      - name: Attach binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # -R 显式指定仓库，避免 gh 在无 git 上下文的 runner 上报 "not a git repository"
          for f in dist/*/*; do
            [ -f "$f" ] || continue
            echo "== upload $f =="
            gh release upload "${{ steps.tag.outputs.tag }}" "$f" -R "${{ github.repository }}" --clobber
          done
