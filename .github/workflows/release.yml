# 发布工作流：三平台（Linux / Windows / macOS）现场编译 LLVM 23 静态链接，
# 构建 logcommenter 可执行文件，并附加到指定 release tag。
# 三平台均启用 ccache（ccache 4.x 支持 MSVC），冷编一次后后续 release 增量构建。
# 只在手动触发或 push 到 v* tag 时运行（不影响日常 CI）。
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag 名（如 v0.1.0），构建产物将附加到该 release'
        required: true
        type: string
  push:
    tags: ['v*']

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: logcommenter-linux-x86_64
            exe: build/logcommenter
            cache_path: ~/.cache/ccache
            install: sudo apt-get update && sudo apt-get install -y ccache
          - os: windows-latest
            artifact: logcommenter-windows-x86_64
            exe: build/Release/logcommenter.exe
            cache_path: C:\Users\runneradmin\AppData\Local\ccache
            install: choco install ccache -y
          - os: macos-latest
            artifact: logcommenter-macos-arm64
            exe: build/logcommenter
            cache_path: /Users/runner/.cache/ccache
            install: brew install ccache
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ matrix.cache_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_path }}
          key: ccache-release-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}

      - name: Install ccache
        run: ${{ matrix.install }}

      - name: Configure
        run: cmake -S . -B build -DLOGCOMMENTER_BUILD_AST=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build logcommenter
        # Windows 上 --parallel 限制并行度避免 OOM；Linux/macOS 用 nproc
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build build --target logcommenter --config Release --parallel 2
          else
            cmake --build build --target logcommenter --config Release --parallel $(nproc)
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.exe }}
          if-no-files-found: error

  attach:
    name: attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT";
          else echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"; fi

      - name: Attach binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for f in dist/*/*; do
            [ -f "$f" ] || continue
            echo "== upload $f =="
            gh release upload "${{ steps.tag.outputs.tag }}" "$f" --clobber
          done
