# 发布工作流：下载预编译 LLVM 23 静态工具链 release asset（见 toolchain.yml），
# 构建 logcommenter 可执行文件，附加到指定 release tag。只在手动触发或 push 到 v* tag 时运行。
name: release
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag 名（如 v0.1.0），构建产物将附加到该 release'
        required: true
        type: string
  push:
    tags: ['v*']
jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: logcommenter-linux-x86_64
            preset: unix-default
            build_dir: build/unix-default
            exe: logcommenter
            install_ninja: sudo apt-get update && sudo apt-get install -y ninja-build
          - os: windows-latest
            artifact: logcommenter-windows-x86_64
            preset: windows-msvc
            build_dir: build/windows-msvc
            exe: logcommenter.exe
            install_ninja: choco install ninja -y
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prebuilt LLVM/Clang
        run: bash tools/fetch_llvm.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ninja
        run: ${{ matrix.install_ninja }}

      - name: Enable MSVC dev environment (for Ninja on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DLLVM_DIR="${{ github.workspace }}/.toolchain/lib/cmake/llvm" \
            -DClang_DIR="${{ github.workspace }}/.toolchain/lib/cmake/clang"
        shell: bash

      - name: Build logcommenter
        run: cmake --build ${{ matrix.build_dir }} --target logcommenter --parallel $( [ "$RUNNER_OS" = "Windows" ] && echo 4 || nproc )
        shell: bash

      - name: Package zip
        run: |
          BD="${{ matrix.build_dir }}"
          TC="${{ github.workspace }}/.toolchain"
          mkdir -p package/lib/clang
          # 从预编译工具链复制 clang 资源头（含 include/ 的版本目录）
          copied=""
          for d in "$TC"/lib/clang/*/include; do
            if [ -d "$d" ]; then cp -r "$(dirname "$d")" package/lib/clang/; copied=1; break; fi
          done
          if [ -z "$copied" ]; then echo "missing clang resource headers in toolchain" >&2; exit 1; fi
          cp "$BD/${{ matrix.exe }}" "package/${{ matrix.exe }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command 'Set-Location package; Compress-Archive -Path * -DestinationPath ..\${{ matrix.artifact }}.zip -Force'
          else
            (cd package && zip -r ../${{ matrix.artifact }}.zip .)
          fi
          rm -rf package
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  attach:
    name: attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Attach binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          # 推送 tag 不会自动创建 GitHub Release；不存在则先创建（自动生成变更说明）
          if ! gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" -R "${{ github.repository }}" --title "$TAG" --generate-notes
          fi
          for f in dist/*/*; do
            [ -f "$f" ] || continue
            echo "== upload $f =="
            gh release upload "$TAG" "$f" -R "${{ github.repository }}" --clobber
          done
