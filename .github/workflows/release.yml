# 发布工作流：三平台（Linux / Windows / macOS）现场编译 LLVM 23 静态链接，
# 构建 logcommenter 可执行文件，并附加到指定 release tag。
# 三平台均启用 ccache（ccache 4.x 支持 MSVC），冷编一次后后续 release 增量构建。
# 只在手动触发或 push 到 v* tag 时运行（不影响日常 CI）。
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag 名（如 v0.1.0），构建产物将附加到该 release'
        required: true
        type: string
  push:
    tags: ['v*']

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      # 注：macOS 暂不支持（现场编译 LLVM 冷编过久），后续加回即可补一行 include。
      matrix:
        include:
          - os: ubuntu-latest
            artifact: logcommenter-linux-x86_64
            exe: build/logcommenter
            cache_path: ~/.cache/ccache
            install: sudo apt-get update && sudo apt-get install -y ccache ninja-build
          - os: windows-latest
            artifact: logcommenter-windows-x86_64
            exe: build/logcommenter.exe
            cache_path: C:\Users\runneradmin\AppData\Local\ccache
            install: choco install ccache -y && choco install ninja -y
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ matrix.cache_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_path }}
          key: ccache-release-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}

      # CPM 检测到 _deps/llvm_project-src 已存在则跳过下载/解压。
      # 缓存解压后的源码目录，避免每次 release 重复下载 1.4GB LLVM 源码。
      - name: Cache LLVM source (CPM)
        uses: actions/cache@v4
        with:
          path: build/_deps/llvm_project-src
          key: llvm-src-${{ matrix.os }}-23.1.3-${{ hashFiles('CMakeLists.txt') }}

      - name: Install ccache
        run: ${{ matrix.install }}

      - name: Configure
        # 统一 Ninja generator：CI 输出带 [N/M] 编译计数（VS generator 在 CI 无计数），
        # 且 Ninja 单 config（exe 输出到 build/，不走 build/Release/）。
        run: cmake -S . -B build -G Ninja -DLOGCOMMENTER_BUILD_AST=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build logcommenter
        # Windows 上 --parallel 限制并行度避免 OOM；Linux 用 nproc
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build build --target logcommenter --parallel 2
          else
            cmake --build build --target logcommenter --parallel $(nproc)
          fi
        shell: bash

      - name: Package zip (platform-prefixed)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path build/logcommenter.exe -DestinationPath ${{ matrix.artifact }}.zip -Force"
          else
            (cd build && zip ../${{ matrix.artifact }}.zip logcommenter)
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  attach:
    name: attach binaries to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT";
          else echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"; fi

      - name: Attach binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # -R 显式指定仓库，避免 gh 在无 git 上下文的 runner 上报 "not a git repository"
          for f in dist/*/*; do
            [ -f "$f" ] || continue
            echo "== upload $f =="
            gh release upload "${{ steps.tag.outputs.tag }}" "$f" -R "${{ github.repository }}" --clobber
          done
