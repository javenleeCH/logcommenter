# 预编译 LLVM/Clang 工具链：把静态 LLVM/Clang 库 + 头文件 + CMake config + clang 内置头
# 一次性构建并安装，打包成 zip 上传到独立 release（toolchain-llvm-<ver>）作为 asset。
# 支持 release / debug 两种构建类型（debug 带 -g 符号，用于本地步进调试 LLVM 内部；
# CI/发布门禁只用 release）。CI/release 工作流下载 asset 后 find_package 复用。
# 只在手动触发时运行（LLVM 版本 + 构建类型各构建一次即可）。
#
# 体积/耗时策略（GitHub release asset 单文件上限 2 GiB，免费 runner job 6h 上限）：
#   - release：全量构建，打包安装树（静态库 + 头 + config + clang 内置头）
#   - debug  ：只构建 logcommenter 实际链接的 clang 库（clangTooling 链）+ X86 target
#              组件 + clang 内置头，不做全量编译 → 体积与耗时都大幅下降；
#              Linux debug 用 -g1（行号表）再降一档；完整 LLVM 源码树独立成一份 asset
#              （llvm-clang-<ver>-src.zip，两平台共用，供调试器源码映射）
name: toolchain

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM 版本（须与 CMakeLists 中期望一致）'
        required: true
        default: '23.1.3'
      build_type:
        description: '构建类型：debug=带 -g 符号（本地步进调试）；release=门禁/发布用'
        required: true
        default: 'release'
        type: choice
        options: ['release', 'debug']

jobs:
  build:
    name: toolchain (${{ matrix.os }}, ${{ github.event.inputs.build_type }})
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "8G"
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: time_macros,pch_defines,include_file_mtime,include_file_ctime
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plat: linux
            install: sudo apt-get update && sudo apt-get install -y ccache ninja-build
          - os: windows-latest
            plat: windows
            install: choco install ccache -y && choco install ninja -y
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 构建类型 → 后缀/CMAKE_BUILD_TYPE/ccache key
      - name: Resolve build type
        id: bt
        shell: bash
        run: |
          BT="${{ github.event.inputs.build_type }}"
          if [ "$BT" = "debug" ]; then
            echo "suffix=-debug" >> "$GITHUB_OUTPUT"
            echo "cmake_build_type=Debug" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "cmake_build_type=Release" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: toolchain-${{ matrix.plat }}-${{ github.event.inputs.build_type }}-llvm-${{ github.event.inputs.llvm_version }}
          restore-keys: |
            toolchain-${{ matrix.plat }}-${{ github.event.inputs.build_type }}-

      - name: Install ccache + ninja
        run: ${{ matrix.install }}

      - name: Enable MSVC dev environment (for Ninja on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Download & extract LLVM source
        shell: bash
        run: |
          VER="${{ github.event.inputs.llvm_version }}"
          curl -L --retry 3 -o llvm.zip \
            "https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${VER}.zip"
          unzip -q llvm.zip
          mv "llvm-project-llvmorg-${VER}" llvm-project

      - name: Configure LLVM/Clang (static, ${{ github.event.inputs.build_type }})
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.build_type }}" = "debug" ] && [ "$RUNNER_OS" != "Windows" ]; then
            # Linux Debug：-g1（行号表）已足够"源码映射 + 步进到源码行"，
            # 显著减小符号体积与冷编耗时（Windows 用 MSVC Debug 默认 /Zi 完整 PDB）
            EXTRA="-DCMAKE_CXX_FLAGS=-g1 -DCMAKE_C_FLAGS=-g1"
          fi
          cmake -G Ninja -S llvm-project/llvm -B llvm-build \
            -DCMAKE_BUILD_TYPE=${{ steps.bt.outputs.cmake_build_type }} \
            $EXTRA \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/toolchain-install" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF

      - name: Build & install
        shell: bash
        run: |
          PAR=$( [ "$RUNNER_OS" = Windows ] && echo 4 || nproc )
          BT="${{ github.event.inputs.build_type }}"
          if [ "$BT" = "debug" ]; then
            # debug：只构建 logcommenter 实际链接的 clang 库（clangTooling 链）
            # + X86 target 组件 + clang 内置头，依赖链自动传递。
            # 不做全量编译 → 库 asset 体积与冷编耗时都大幅下降，避开 2GiB/6h 限制。
            cmake --build llvm-build --parallel "$PAR" --target \
              clangTooling clangASTMatchers clangRewrite clangFrontend \
              clangSerialization clangAST clangBasic clangLex clang-resource-headers \
              LLVMX86Info LLVMX86Desc LLVMX86CodeGen LLVMX86AsmParser \
              LLVMX86Disassembler LLVMX86Utils
            # 手工安装需要部分（cmake --install 会因未构建的库缺失而报错，故不用它）：
            mkdir -p toolchain-install/lib toolchain-install/include
            cp -r llvm-build/lib/cmake toolchain-install/lib/
            cp -r llvm-project/llvm/include/. toolchain-install/include/
            cp -r llvm-project/clang/include/. toolchain-install/include/
            cp -r llvm-build/include/. toolchain-install/include/ 2>/dev/null || true
            cp llvm-build/lib/*.a toolchain-install/lib/ 2>/dev/null || true
            cp -r llvm-build/lib/clang toolchain-install/lib/ 2>/dev/null || true
          else
            cmake --build llvm-build --parallel "$PAR"
            cmake --install llvm-build
          fi

      - name: Show ccache stats
        shell: bash
        run: ccache --show-stats --verbose

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: toolchain-${{ matrix.plat }}-${{ github.event.inputs.build_type }}-llvm-${{ github.event.inputs.llvm_version }}

      - name: Package installed tree
        shell: bash
        run: |
          VER="${{ github.event.inputs.llvm_version }}"
          ASSET="llvm-clang-${{ matrix.plat }}-x86_64-${VER}${{ steps.bt.outputs.suffix }}.zip"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          # debug：LLVM 源码树独立成一份 asset（两平台共用，供调试器源码映射）。
          # 只由 Linux job 打包/上传一次，避免两个平台重复上传同名文件。
          if [ "${{ github.event.inputs.build_type }}" = "debug" ] && [ "$RUNNER_OS" != "Windows" ]; then
            SRC_ASSET="llvm-clang-${VER}-src.zip"
            echo "SRC_ASSET=$SRC_ASSET" >> "$GITHUB_ENV"
            (cd llvm-project && zip -qr "../$SRC_ASSET" .)
            echo "packaged source tree: $(du -h "$SRC_ASSET" | cut -f1)"
          fi
          # 只打包安装树（含 lib/cmake/{llvm,clang} config、静态库、头、clang 内置头）
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command 'Set-Location toolchain-install; Compress-Archive -Path * -DestinationPath ..\'"$ASSET"' -Force'
          else
            (cd toolchain-install && zip -r "../$ASSET" .)
          fi
          echo "packaged install tree: $(du -h "$ASSET" | cut -f1)"

      - name: Upload to toolchain release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER="${{ github.event.inputs.llvm_version }}"
          TAG="toolchain-llvm-${VER}"
          if ! gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" -R "${{ github.repository }}" \
              --prerelease \
              --title "Prebuilt LLVM/Clang ${VER} (static, x86_64)" \
              --notes "Static LLVM/Clang consumed via find_package. Do not delete; CI downloads these assets."
          fi
          gh release upload "$TAG" "${{ env.ASSET }}" -R "${{ github.repository }}" --clobber
          if [ -n "${{ env.SRC_ASSET }}" ]; then
            gh release upload "$TAG" "${{ env.SRC_ASSET }}" -R "${{ github.repository }}" --clobber
          fi
