name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 纯逻辑核心 + 单测：零 Clang 依赖，三平台快速验证跨平台可编译
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: unix-default
            build_dir: build/unix-default
          - os: windows-latest
            preset: windows-msvc
            build_dir: build/windows-msvc
          - os: macos-latest
            preset: unix-default
            build_dir: build/unix-default
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ninja; else sudo apt-get update && sudo apt-get install -y ninja-build; fi
        shell: bash
      - name: Install ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Enable MSVC dev environment (Ninja on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Configure (core only)
        run: cmake --preset ${{ matrix.preset }} -DLOGCOMMENTER_BUILD_AST=OFF
      - name: Build core tests
        run: cmake --build ${{ matrix.build_dir }} --target logcommenter_tests
      - name: Run unit tests
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure

  # 完整工具（AST 引擎 + CLI）：CPM 全量构建 LLVM/Clang。
  # Linux/macOS 用 ccache（GCC/Clang 支持成熟），Windows/MSVC 用 sccache（对 MSVC 的
  # 路径/调试信息处理更稳）。缓存目录只存编译器缓存，不缓存 build 产物；key 固定按
  # runner.os + compiler + LLVM 版本，不绑 commit SHA / CMakeLists hash，跨构建累积命中。
  ast:
    name: ast (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            preset: unix-default
            build_dir: build/unix-default
            exe: logcommenter
            jobs: "$(nproc)"
            launcher: ccache
            cache_dir: ${{ github.workspace }}/.ccache
            install: sudo apt-get update && sudo apt-get install -y ccache ninja-build
          - os: windows-latest
            compiler: msvc
            preset: windows-msvc
            build_dir: build/windows-msvc
            exe: logcommenter.exe
            jobs: "4"
            launcher: sccache
            cache_dir: ${{ github.workspace }}/.sccache
            install: choco install sccache ninja -y
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 配置编译器缓存环境（仅当前平台会生效的那一个）
      - name: Setup compiler cache env
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_CACHE_SIZE=20G" >> "$GITHUB_ENV"
          else
            # ccache 关键配置：内容哈希（镜像重装 mtime 变也不失效）、BASEDIR/NOHASHDIR
            # 稳定绝对路径、SLOPPINESS 放行 LLVM 的 PCH/time macros。
            echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> "$GITHUB_ENV"
            echo "CCACHE_MAXSIZE=5G" >> "$GITHUB_ENV"
            echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
            echo "CCACHE_BASEDIR=${{ github.workspace }}" >> "$GITHUB_ENV"
            echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
            echo "CCACHE_SLOPPINESS=time_macros,pch_defines,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"
          fi

      - name: Cache compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_dir }}
          key: ${{ runner.os }}-${{ matrix.compiler }}-llvm-23.1.3
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-

      - name: Install compiler cache + ninja
        run: ${{ matrix.install }}

      - name: Enable MSVC dev environment (Ninja on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      # CPM 检测到源码已存在则跳过下载/解压。必须同时缓存 subbuild（含 ExternalProject
      # stamp）：只缓存 src 时每次 configure 仍会重下 1.4GB zip。key 固定按 LLVM 版本。
      - name: Cache LLVM source (CPM)
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.build_dir }}/_deps/llvm_project-src
            ${{ matrix.build_dir }}/_deps/llvm_project-subbuild
          key: llvm-src-${{ runner.os }}-23.1.3

      # ccache 统计清零（sccache 每 job 新起 daemon，天然只计本次）
      - name: Zero ccache stats (Linux)
        if: runner.os != 'Windows'
        run: ccache -z
        shell: bash

      # CMAKE_BUILD_TYPE 由 preset 固定为 Release；C/C++ launcher 都设上以覆盖 LLVM 的 C 源
      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --preset ${{ matrix.preset }} \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache
          else
            cmake --preset ${{ matrix.preset }} \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache
          fi

      - name: Build full tool
        run: cmake --build ${{ matrix.build_dir }} --target logcommenter --parallel ${{ matrix.jobs }}
        shell: bash

      - name: Build tests
        run: cmake --build ${{ matrix.build_dir }} --target logcommenter_tests
        shell: bash

      - name: Run unit tests
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure
        shell: bash

      - name: Show compiler cache stats
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            sccache --show-stats
          else
            ccache --show-stats --verbose
          fi

      # sccache 常驻 daemon 会把缓存缓存在内存，actions/cache 保存前必须 stop 落盘
      - name: Stop sccache server (flush to disk)
        if: always() && runner.os == 'Windows'
        run: sccache --stop-server || true
        shell: bash

      - name: E2E smoke (comment + inject)
        run: |
          set -e
          BD="${{ matrix.build_dir }}"
          EXE="$BD/${{ matrix.exe }}"
          # clang 的 builtin 头（stddef.h 等）只从 <resource-dir>/include 查找，
          # -resource-dir 必须指向直接包含 include/ 的版本目录。按标准结构复制
          # 构建树 clang-resource-headers 生成的版本目录到 exe 旁（验证随包分发布局）；
          # 无则回退源码头 23.1.3
          mkdir -p "$BD/lib/clang"
          copied=""
          for d in "$BD"/_deps/llvm_project-build/lib/clang/*/include; do
            if [ -d "$d" ]; then cp -r "$(dirname "$d")" "$BD/lib/clang/"; copied=1; break; fi
          done
          if [ -z "$copied" ]; then
            mkdir -p "$BD/lib/clang/23.1.3/include"
            cp -r "$BD"/_deps/llvm_project-src/clang/lib/Headers/* "$BD/lib/clang/23.1.3/include/"
          fi
          export LOGCOMMENTER_DEBUG=1
          # --comment：sample.cpp 中含 pengtest 的日志应被注释（输出 TextEdit "// "）
          "$EXE" --comment --file src/sample.cpp \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_comment.json
          grep -Fq '"// "' /tmp/e2e_comment.json && echo "E2E comment OK"
          cat /tmp/e2e_comment.json
          # --inject --var：在变量 total 处注入观测日志（输出 TextEdit 含 total=）
          "$EXE" --inject --file src/sample.cpp --var total \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_inject.json
          grep -Fq 'total=' /tmp/e2e_inject.json && echo "E2E inject(var) OK"
          cat /tmp/e2e_inject.json
          # --inject --position：total 定义在第 10 行（标识符 col7-11），选 10:8 应按位置命中
          "$EXE" --inject --file src/sample.cpp --position 10:8 \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_pos.json
          grep -Fq 'total=' /tmp/e2e_pos.json && echo "E2E inject(position) OK"
          cat /tmp/e2e_pos.json
          # 对象类型 fallback：Config 对象（不可 <<）应输出 (ptr) 地址观测
          "$EXE" --inject --file src/sample.cpp --var cfg \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_obj.json
          grep -Fq '(ptr)' /tmp/e2e_obj.json && echo "E2E inject(object ptr) OK"
          cat /tmp/e2e_obj.json
          # --inject --position 落在引用处（return total; 第 14 行，total 标识符
          # col10-14）：应解析到声明并在声明语句后注入（方案 §3.4）
          "$EXE" --inject --file src/sample.cpp --position 14:12 \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_ref.json
          grep -Fq 'total=' /tmp/e2e_ref.json && echo "E2E inject(position on ref) OK"
          cat /tmp/e2e_ref.json
          # 应用校验：把 inject 的 TextEdit 真正应用到副本上，
          # 结果必须仍是合法 C++（可再次解析）且重复注入幂等
          python3 tools/e2e_apply_check.py "$EXE" \
            src/sample.cpp "$BD/compile_commands.json"
        shell: bash
