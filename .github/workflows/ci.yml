name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 纯逻辑核心 + 单测：零 Clang 依赖，快、必绿
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (core only)
        run: cmake -S . -B build -DLOGCOMMENTER_BUILD_AST=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build core tests
        run: cmake --build build --target logcommenter_tests -j$(nproc)
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  # 完整工具（AST 引擎 + CLI）：CPM 全量构建 LLVM/Clang，编译并跑全部单测。
  # 用 ccache 做编译级缓存：即使某次构建失败，已编译的 LLVM 单元也进 ccache，
  # 下次增量复用，避免每次 push 都全量重编 LLVM。
  ast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-logcommenter-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            ccache-logcommenter-${{ runner.os }}-
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache
      - name: Configure (full, CPM)
        run: cmake -S . -B build -DLOGCOMMENTER_BUILD_AST=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build full tool
        run: cmake --build build --target logcommenter -j$(nproc)
      - name: Save ccache even on failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Build tests
        run: cmake --build build --target logcommenter_tests -j$(nproc)
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Locate builtin headers (diagnostic)
        run: |
          echo "== find stddef.h whole workspace =="
          find /home/runner/work/logcommenter -name stddef.h 2>/dev/null | head -20 || true
          echo "== _deps lib tree =="
          ls -R build/_deps/llvm_project-build/lib 2>/dev/null | head -60 || true
          echo "== any lib/clang dirs =="
          find /home/runner/work/logcommenter -type d -path '*/lib/clang*' 2>/dev/null | head -20 || true
          echo "== any clang include dir with builtin headers =="
          find /home/runner/work/logcommenter -type d -name include -path '*clang*' 2>/dev/null | head -20 || true
      - name: E2E smoke (comment + inject)
        run: |
          set -e
          # --comment：sample.cpp 中含 pengtest 的日志应被注释（输出 TextEdit "// "）
          ./build/logcommenter --comment --file src/sample.cpp \
            --compile-commands build/compile_commands.json > /tmp/e2e_comment.json
          grep -Fq '"// "' /tmp/e2e_comment.json && echo "E2E comment OK"
          cat /tmp/e2e_comment.json
          # --inject：在变量 total 处注入观测日志（输出 TextEdit 含 total=）
          ./build/logcommenter --inject --file src/sample.cpp --var total \
            --compile-commands build/compile_commands.json > /tmp/e2e_inject.json
          grep -Fq 'total=' /tmp/e2e_inject.json && echo "E2E inject OK"
          cat /tmp/e2e_inject.json
