name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 纯逻辑核心 + 单测：零 Clang 依赖，快、必绿
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (core only)
        run: cmake -S . -B build -DLOGCOMMENTER_BUILD_AST=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build core tests
        run: cmake --build build --target logcommenter_tests -j$(nproc)
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  # 完整工具（AST 引擎 + CLI）：系统 LLVM 库 + LLVM 源码头，编译并跑全部单测
  ast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM / Clang (apt.llvm.org)
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 18
          # libclang-cpp18-dev 提供 libclang-cpp 库
          sudo apt-get install -y libclang-cpp18-dev
      - name: Fetch clang headers from LLVM source
        run: |
          # 系统 clang 包不打包 LibTooling 头（clang/AST/*.h），
          # 浅克隆 llvm-project 只取 include 目录补头，链接用系统 libclang-cpp18 库。
          git clone --depth 1 --filter=blob:none --sparse \
            --branch llvmorg-18.1.8 https://github.com/llvm/llvm-project /opt/llvm-src
          cd /opt/llvm-src && git sparse-checkout set clang/include llvm/include
      - name: Configure (full)
        run: cmake -S . -B build -DLOGCOMMENTER_BUILD_AST=ON -DLOGCOMMENTER_SYSTEM_LLVM=ON -DLLVM_SRC=/opt/llvm-src -DCMAKE_BUILD_TYPE=Release
      - name: Build full tool
        run: cmake --build build --target logcommenter -j$(nproc)
      - name: Build tests
        run: cmake --build build --target logcommenter_tests -j$(nproc)
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
