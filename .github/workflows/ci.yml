name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 纯逻辑核心 + 单测：零 Clang 依赖，三平台快速验证跨平台可编译
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: unix-default
            build_dir: build/unix-default
          - os: windows-latest
            preset: windows-msvc
            build_dir: build/windows-msvc
          - os: macos-latest
            preset: unix-default
            build_dir: build/unix-default
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ninja; else sudo apt-get update && sudo apt-get install -y ninja-build; fi
        shell: bash
      - name: Install ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Enable MSVC dev environment (Ninja on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Configure (core only)
        run: cmake --preset ${{ matrix.preset }} -DLOGCOMMENTER_BUILD_AST=OFF
      - name: Build core tests
        run: cmake --build ${{ matrix.build_dir }} --target logcommenter_tests
      - name: Run unit tests
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure

  # 完整工具（AST 引擎 + CLI）：CPM 全量构建 LLVM/Clang；ubuntu 用系统工具链（unix-default），
  # windows 用 MSVC cl.exe（windows-msvc）。编译并跑全部单测 + E2E。ccache 跨平台启用：
  # 缓存目录放在工作区内（launcher 与 cache action 同一原生路径），即便某次构建失败也落盘，
  # 下次增量复用，避免每次 push 都全量重编 LLVM。
  ast:
    name: ast (${{ matrix.os }})
    # ccache 关键配置（Ubuntu + Windows 一致）：
    #  - 缓存目录在工作区内，避免 ~/$HOME 在 Windows 上展开不一致
    #  - COMPILERCHECK=content：按编译器二进制内容哈希，runner 镜像重装后 mtime 变也不失效
    #  - BASEDIR + NOHASHDIR：绝对路径/构建目录不进哈希
    #  - SLOPPINESS：LLVM 用 PCH（pch_defines）+ time macros，否则这些 TU 不可缓存
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "5G"
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: time_macros,pch_defines,include_file_mtime,include_file_ctime
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: unix-default
            build_dir: build/unix-default
            exe: logcommenter
            jobs: "$(nproc)"
            install: sudo apt-get update && sudo apt-get install -y ccache ninja-build
          - os: windows-latest
            preset: windows-msvc
            build_dir: build/windows-msvc
            exe: logcommenter.exe
            jobs: "4"
            install: choco install ccache -y && choco install ninja -y
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # restore 与 save 拆分：restore 不自动保存，save 只在本次未命中缓存时执行，
      # 这样 job 失败时也能把已编译的 LLVM 单元落盘（下次增量复用），且不会与已有缓存冲突。
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          # ccache 内容寻址，跨构建累积命中，key 固定按 LLVM 版本（与 LLVM 源码缓存一致），
          # 不要用 hashFiles(CMakeLists.txt) —— 那样 CMake 一改整份缓存就失效。
          key: ccache-logcommenter-${{ runner.os }}-llvm-23.1.3
          restore-keys: |
            ccache-logcommenter-${{ runner.os }}-
      - name: Install ccache + ninja
        run: ${{ matrix.install }}
      - name: Enable MSVC dev environment (Ninja on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      # LLVM 源码缓存同样用 restore/save 拆分（避免 combined actions/cache 与 restore/save
      # 混用导致 post-step 不保存）。CPM 看到源码已存在则跳过下载/解压。
      - name: Restore LLVM source cache
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ matrix.build_dir }}/_deps/llvm_project-src
            ${{ matrix.build_dir }}/_deps/llvm_project-subbuild
          key: llvm-src-${{ runner.os }}-23.1.3
      # 清零统计，使后面的 stats 只描述本次构建
      - name: Zero ccache stats
        run: ccache -z
        shell: bash
      # CMAKE_BUILD_TYPE 由 preset 固定为 Release
      - name: Configure (full, preset)
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        shell: bash
      - name: Build full tool
        run: cmake --build ${{ matrix.build_dir }} --target logcommenter --parallel ${{ matrix.jobs }}
        shell: bash
      - name: Show ccache stats
        run: ccache --show-stats --verbose
        shell: bash
      # TEMP DIAGNOSTIC（build 之后）：用 Windows 原生绝对路径 vs 相对路径跑 exe，
      # 验证 readEntry 能否命中 sample.cpp
      - name: DIAG test file path resolution
        run: |
          BD="${{ matrix.build_dir }}"
          EXE="$BD/${{ matrix.exe }}"
          WINABS=$(cygpath -w "$(pwd)/src/sample.cpp")
          echo "==== win abs = $WINABS ===="
          set +e
          echo "==== ABSOLUTE path ===="
          "$EXE" --comment --file "$WINABS" --compile-commands "$BD/compile_commands.json" 2>/tmp/abs_err.txt 1>/tmp/abs_out.json
          echo "exit=$?"; echo "stderr:"; cat /tmp/abs_err.txt; echo "stdout head:"; head -c 500 /tmp/abs_out.json; echo
          echo "==== RELATIVE path ===="
          "$EXE" --comment --file src/sample.cpp --compile-commands "$BD/compile_commands.json" 2>/tmp/rel_err.txt 1>/dev/null
          echo "exit=$?"; echo "stderr:"; cat /tmp/rel_err.txt
        shell: bash
      # 只在本次未命中 ccache 时保存；命中时已有缓存，跳过避免 key 冲突。always() 保证
      # 即使后续 E2E 失败，本次冷构建也已落盘。
      - name: Save ccache even on failure
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-logcommenter-${{ runner.os }}-llvm-23.1.3
      # LLVM source 保存：restore 未命中时落盘（即使构建失败）
      - name: Save LLVM source cache
        if: always() && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ matrix.build_dir }}/_deps/llvm_project-src
            ${{ matrix.build_dir }}/_deps/llvm_project-subbuild
          key: llvm-src-${{ runner.os }}-23.1.3
      - name: Build tests
        run: cmake --build ${{ matrix.build_dir }} --target logcommenter_tests
        shell: bash
      - name: Run unit tests
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure
        shell: bash
      - name: E2E smoke (comment + inject)
        run: |
          set -e
          BD="${{ matrix.build_dir }}"
          EXE="$BD/${{ matrix.exe }}"
          # clang 的 builtin 头（stddef.h 等）只从 <resource-dir>/include 查找，
          # -resource-dir 必须指向直接包含 include/ 的版本目录。按标准结构复制
          # 构建树 clang-resource-headers 生成的版本目录到 exe 旁（验证随包分发布局）；
          # 无则回退源码头 23.1.3
          mkdir -p "$BD/lib/clang"
          copied=""
          for d in "$BD"/_deps/llvm_project-build/lib/clang/*/include; do
            if [ -d "$d" ]; then cp -r "$(dirname "$d")" "$BD/lib/clang/"; copied=1; break; fi
          done
          if [ -z "$copied" ]; then
            mkdir -p "$BD/lib/clang/23.1.3/include"
            cp -r "$BD"/_deps/llvm_project-src/clang/lib/Headers/* "$BD/lib/clang/23.1.3/include/"
          fi
          export LOGCOMMENTER_DEBUG=1
          # --comment：sample.cpp 中含 pengtest 的日志应被注释（输出 TextEdit "// "）
          "$EXE" --comment --file src/sample.cpp \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_comment.json
          grep -Fq '"// "' /tmp/e2e_comment.json && echo "E2E comment OK"
          cat /tmp/e2e_comment.json
          # --inject --var：在变量 total 处注入观测日志（输出 TextEdit 含 total=）
          "$EXE" --inject --file src/sample.cpp --var total \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_inject.json
          grep -Fq 'total=' /tmp/e2e_inject.json && echo "E2E inject(var) OK"
          cat /tmp/e2e_inject.json
          # --inject --position：total 定义在第 10 行（标识符 col7-11），选 10:8 应按位置命中
          "$EXE" --inject --file src/sample.cpp --position 10:8 \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_pos.json
          grep -Fq 'total=' /tmp/e2e_pos.json && echo "E2E inject(position) OK"
          cat /tmp/e2e_pos.json
          # 对象类型 fallback：Config 对象（不可 <<）应输出 (ptr) 地址观测
          "$EXE" --inject --file src/sample.cpp --var cfg \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_obj.json
          grep -Fq '(ptr)' /tmp/e2e_obj.json && echo "E2E inject(object ptr) OK"
          cat /tmp/e2e_obj.json
          # --inject --position 落在引用处（return total; 第 14 行，total 标识符
          # col10-14）：应解析到声明并在声明语句后注入（方案 §3.4）
          "$EXE" --inject --file src/sample.cpp --position 14:12 \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_ref.json
          grep -Fq 'total=' /tmp/e2e_ref.json && echo "E2E inject(position on ref) OK"
          cat /tmp/e2e_ref.json
          # 应用校验：把 inject 的 TextEdit 真正应用到副本上，
          # 结果必须仍是合法 C++（可再次解析）且重复注入幂等
          python3 tools/e2e_apply_check.py "$EXE" \
            src/sample.cpp "$BD/compile_commands.json"
        shell: bash
