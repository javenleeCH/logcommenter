name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 纯逻辑核心 + 单测：零 Clang 依赖，快、必绿
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure (core only)
        run: cmake -S . -B build -G Ninja -DLOGCOMMENTER_BUILD_AST=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build core tests
        run: cmake --build build --target logcommenter_tests -j$(nproc)
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  # 完整工具（AST 引擎 + CLI）：CPM 全量构建 LLVM/Clang，编译并跑全部单测。
  # 用 ccache 做编译级缓存：即使某次构建失败，已编译的 LLVM 单元也进 ccache，
  # 下次增量复用，避免每次 push 都全量重编 LLVM。
  ast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          # ccache 内容寻址，跨构建累积命中，key 固定按 LLVM 版本（与 LLVM 源码缓存一致），
          # 不要用 hashFiles(CMakeLists.txt) —— 那样 CMake 一改整份缓存就失效。
          key: ccache-logcommenter-${{ runner.os }}-llvm-23.1.3
          restore-keys: |
            ccache-logcommenter-${{ runner.os }}-
      - name: Install ccache + ninja
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build
      # CPM 检测到源码已存在则跳过下载/解压。必须同时缓存 subbuild（含 ExternalProject
      # stamp）：只缓存 src 时每次 configure 仍会重下 1.4GB zip。key 固定按 LLVM 版本，升级时手动改。
      - name: Cache LLVM source (CPM)
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/llvm_project-src
            build/_deps/llvm_project-subbuild
          key: llvm-src-${{ runner.os }}-23.1.3
      - name: Configure (full, CPM)
        run: cmake -S . -B build -G Ninja -DLOGCOMMENTER_BUILD_AST=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build full tool
        run: cmake --build build --target logcommenter -j$(nproc)
      - name: Save ccache even on failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Build tests
        run: cmake --build build --target logcommenter_tests -j$(nproc)
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
      - name: E2E smoke (comment + inject)
        run: |
          set -e
          # clang 的 builtin 头（stddef.h 等）只从 <resource-dir>/include 查找，
          # -resource-dir 必须指向直接包含 include/ 的版本目录。按标准结构复制
          # 构建树 clang-resource-headers 生成的版本目录到 exe 旁（验证随包分发布局）；
          # 无则回退源码头 23.1.3
          mkdir -p build/lib/clang
          copied=""
          for d in build/_deps/llvm_project-build/lib/clang/*/include; do
            if [ -d "$d" ]; then cp -r "$(dirname "$d")" build/lib/clang/; copied=1; break; fi
          done
          if [ -z "$copied" ]; then
            mkdir -p build/lib/clang/23.1.3/include
            cp -r build/_deps/llvm_project-src/clang/lib/Headers/* build/lib/clang/23.1.3/include/
          fi
          export LOGCOMMENTER_DEBUG=1
          # --comment：sample.cpp 中含 pengtest 的日志应被注释（输出 TextEdit "// "）
          ./build/logcommenter --comment --file src/sample.cpp \
            --compile-commands build/compile_commands.json > /tmp/e2e_comment.json
          grep -Fq '"// "' /tmp/e2e_comment.json && echo "E2E comment OK"
          cat /tmp/e2e_comment.json
          # --inject --var：在变量 total 处注入观测日志（输出 TextEdit 含 total=）
          ./build/logcommenter --inject --file src/sample.cpp --var total \
            --compile-commands build/compile_commands.json > /tmp/e2e_inject.json
          grep -Fq 'total=' /tmp/e2e_inject.json && echo "E2E inject(var) OK"
          cat /tmp/e2e_inject.json
          # --inject --position：total 定义在第 10 行（标识符 col7-11），选 10:8 应按位置命中
          ./build/logcommenter --inject --file src/sample.cpp --position 10:8 \
            --compile-commands build/compile_commands.json > /tmp/e2e_pos.json
          grep -Fq 'total=' /tmp/e2e_pos.json && echo "E2E inject(position) OK"
          cat /tmp/e2e_pos.json
          # 对象类型 fallback：Config 对象（不可 <<）应输出 (ptr) 地址观测
          ./build/logcommenter --inject --file src/sample.cpp --var cfg \
            --compile-commands build/compile_commands.json > /tmp/e2e_obj.json
          grep -Fq '(ptr)' /tmp/e2e_obj.json && echo "E2E inject(object ptr) OK"
          cat /tmp/e2e_obj.json
          # --inject --position 落在引用处（return total; 第 14 行，total 标识符
          # col10-14）：应解析到声明并在声明语句后注入（方案 §3.4）
          ./build/logcommenter --inject --file src/sample.cpp --position 14:12 \
            --compile-commands build/compile_commands.json > /tmp/e2e_ref.json
          grep -Fq 'total=' /tmp/e2e_ref.json && echo "E2E inject(position on ref) OK"
          cat /tmp/e2e_ref.json
          # 应用校验：把 inject 的 TextEdit 真正应用到副本上，
          # 结果必须仍是合法 C++（可再次解析）且重复注入幂等
          python3 tools/e2e_apply_check.py build/logcommenter \
            src/sample.cpp build/compile_commands.json
