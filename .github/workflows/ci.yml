name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 纯逻辑核心 + 单测：零 Clang 依赖，快、必绿
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (core only)
        run: cmake -S . -B build -DLOGCOMMENTER_BUILD_AST=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build core tests
        run: cmake --build build --target logcommenter_tests -j$(nproc)
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  # 完整工具（AST 引擎 + CLI）：用系统 LLVM 编译并跑全部单测
  ast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM / Clang
        run: |
          sudo apt-get update
          # clang 头文件（clang/AST/*.h）：libclang-common-18-dev 与 clang-18 均提供
          sudo apt-get install -y clang llvm-dev libclang-cpp-dev libclang-common-18-dev clang-18
          # 确保 llvm-config 可解析；若默认不在 PATH，显式加入
          which llvm-config || (ls /usr/lib/llvm-*/bin/llvm-config* && echo "/usr/lib/llvm-*/bin" >> "$GITHUB_PATH")
      - name: Locate clang headers
        run: |
          for p in clang-18 libclang-common-18-dev libclang-cpp18-dev libclang-cpp-dev llvm-18-dev clang-tools-18; do
            echo "== $p =="
            dpkg -L $p 2>/dev/null | grep -i 'ASTConsumer' | head -5
          done
          find /usr -name 'ASTConsumer.h' 2>/dev/null | head
      - name: Configure (full)
        run: cmake -S . -B build -DLOGCOMMENTER_BUILD_AST=ON -DLOGCOMMENTER_SYSTEM_LLVM=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build full tool
        run: cmake --build build --target logcommenter -j$(nproc)
      - name: Build tests
        run: cmake --build build --target logcommenter_tests -j$(nproc)
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
