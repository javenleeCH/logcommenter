name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 纯逻辑核心 + 单测：零 Clang 依赖，三平台快速验证跨平台可编译
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: unix-default
            build_dir: build/unix-default
          - os: windows-latest
            preset: windows-msvc
            build_dir: build/windows-msvc
          - os: macos-latest
            preset: unix-default
            build_dir: build/unix-default
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ninja; else sudo apt-get update && sudo apt-get install -y ninja-build; fi
        shell: bash
      - name: Install ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Enable MSVC dev environment (Ninja on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Configure (core only)
        run: cmake --preset ${{ matrix.preset }} -DLOGCOMMENTER_BUILD_AST=OFF
      - name: Build core tests
        run: cmake --build ${{ matrix.build_dir }} --target logcommenter_tests
      - name: Run unit tests
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure

  # VSCode 插件薄壳（TypeScript）：tsc 编译 + 协议层单测（node 内置 runner，秒级）
  plugin:
    name: plugin (vscode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        working-directory: vscode
        run: npm install --no-audit --no-fund
      - name: Build (tsc)
        working-directory: vscode
        run: npm run build
      - name: Protocol unit tests (compiled)
        working-directory: vscode
        run: node --test dist/test/protocol.test.js

  # 完整工具（AST 引擎 + CLI）：下载预编译 LLVM/Clang 静态工具链 release asset（见
  # toolchain.yml / tools/fetch_llvm.sh），find_package 复用，不再从源码构建 LLVM。
  # Ubuntu 用系统工具链（unix-default），Windows 用 MSVC（windows-msvc）。
  ast:
    name: ast (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: unix-default
            build_dir: build/unix-default
            exe: logcommenter
            jobs: "$(nproc)"
            install_ninja: sudo apt-get update && sudo apt-get install -y ninja-build
          - os: windows-latest
            preset: windows-msvc
            build_dir: build/windows-msvc
            exe: logcommenter.exe
            jobs: "4"
            install_ninja: choco install ninja -y
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 下载预编译 LLVM（包含静态库、头、CMake config、clang 内置头）
      - name: Fetch prebuilt LLVM/Clang
        run: bash tools/fetch_llvm.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ninja
        run: ${{ matrix.install_ninja }}

      - name: Enable MSVC dev environment (Ninja on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      # CMAKE_BUILD_TYPE 由 preset 固定为 Release；LLVM_DIR/Clang_DIR 指向预编译工具链
      - name: Configure (full, preset)
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DLLVM_DIR="${{ github.workspace }}/.toolchain/lib/cmake/llvm" \
            -DClang_DIR="${{ github.workspace }}/.toolchain/lib/cmake/clang"
        shell: bash

      - name: Build full tool
        run: cmake --build ${{ matrix.build_dir }} --target logcommenter --parallel ${{ matrix.jobs }}
        shell: bash

      - name: Build tests
        run: cmake --build ${{ matrix.build_dir }} --target logcommenter_tests
        shell: bash

      - name: Run unit tests
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure
        shell: bash

      - name: E2E smoke (comment + inject)
        run: |
          set -e
          BD="${{ matrix.build_dir }}"
          EXE="$BD/${{ matrix.exe }}"
          TC="${{ github.workspace }}/.toolchain"
          # clang 的 builtin 头（stddef.h 等）只从 <resource-dir>/include 查找，
          # -resource-dir 必须指向直接包含 include/ 的版本目录。从预编译工具链复制
          # 版本目录到 exe 旁（验证随包分发布局）。
          mkdir -p "$BD/lib/clang"
          copied=""
          for d in "$TC"/lib/clang/*/include; do
            if [ -d "$d" ]; then cp -r "$(dirname "$d")" "$BD/lib/clang/"; copied=1; break; fi
          done
          if [ -z "$copied" ]; then echo "missing clang resource headers in toolchain" >&2; exit 1; fi
          export LOGCOMMENTER_DEBUG=1
          # --comment：sample.cpp 中含 pengtest 的日志应被注释（输出 TextEdit "// "）
          "$EXE" --comment --file src/sample.cpp \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_comment.json
          grep -Fq '"// "' /tmp/e2e_comment.json && echo "E2E comment OK"
          cat /tmp/e2e_comment.json
          # --inject --var：在变量 total 处注入观测日志（输出 TextEdit 含 total=）
          "$EXE" --inject --file src/sample.cpp --var total \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_inject.json
          grep -Fq 'total=' /tmp/e2e_inject.json && echo "E2E inject(var) OK"
          cat /tmp/e2e_inject.json
          # --inject --position：total 定义在第 10 行（标识符 col7-11），选 10:8 应按位置命中
          "$EXE" --inject --file src/sample.cpp --position 10:8 \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_pos.json
          grep -Fq 'total=' /tmp/e2e_pos.json && echo "E2E inject(position) OK"
          cat /tmp/e2e_pos.json
          # 对象类型 fallback：Config 对象（不可 <<）应输出 (ptr) 地址观测
          "$EXE" --inject --file src/sample.cpp --var cfg \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_obj.json
          grep -Fq '(ptr)' /tmp/e2e_obj.json && echo "E2E inject(object ptr) OK"
          cat /tmp/e2e_obj.json
          # --inject --position 落在引用处（return total; 第 14 行，total 标识符
          # col10-14）：应解析到声明并在声明语句后注入（方案 §3.4）
          "$EXE" --inject --file src/sample.cpp --position 14:12 \
            --compile-commands "$BD/compile_commands.json" > /tmp/e2e_ref.json
          grep -Fq 'total=' /tmp/e2e_ref.json && echo "E2E inject(position on ref) OK"
          cat /tmp/e2e_ref.json
          # 应用校验：把 inject 的 TextEdit 真正应用到副本上，
          # 结果必须仍是合法 C++（可再次解析）且重复注入幂等
          python3 tools/e2e_apply_check.py "$EXE" \
            src/sample.cpp "$BD/compile_commands.json"
          # B 组系统测试（ubuntu only：脚本用系统 clang++ 做编译验证；
          # 引擎行为平台无关，A 组场景仍双平台验证）
          if [ "$RUNNER_OS" = "Linux" ]; then
            python3 tools/e2e_bgroup.py "$EXE"
          fi
        shell: bash
