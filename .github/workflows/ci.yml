name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 纯逻辑核心 + 单测：零 Clang 依赖，快、必绿
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (core only)
        run: cmake -S . -B build -DLOGCOMMENTER_BUILD_AST=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build core tests
        run: cmake --build build --target logcommenter_tests -j$(nproc)
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  # 完整工具（AST 引擎 + CLI）：CPM 全量构建 LLVM/Clang（头文件完整），编译并跑单测。
  # 首次构建较慢，用 actions/cache 缓存 build 目录，后续命中缓存秒过。
  ast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache LLVM build
        uses: actions/cache@v4
        with:
          path: build
          key: logcommenter-llvm-23.1.3-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/CPM.cmake') }}
      - name: Configure (full, CPM)
        run: cmake -S . -B build -DLOGCOMMENTER_BUILD_AST=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build full tool
        run: cmake --build build --target logcommenter -j$(nproc)
      - name: Build tests
        run: cmake --build build --target logcommenter_tests -j$(nproc)
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
